<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-labelledby="t d">

<style>
  svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
        --grid:#e1e0d9; --axis:#c3c2b7; --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; }
  @media (prefers-color-scheme: dark) {
    svg { --surface:#1a1a19; --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781;
          --grid:#2c2c2a; --axis:#383835; --s1:#3987e5; --s2:#d95926; --s3:#199e70; }
  }
  .bg { fill: var(--surface); }
  .title { fill: var(--ink); font: 600 15px system-ui, -apple-system, "Segoe UI", sans-serif; }
  .subtitle { fill: var(--ink2); font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; }
  .tick { fill: var(--muted); font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; font-variant-numeric: tabular-nums; }
  .label { fill: var(--ink2); font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; }
  .value { fill: var(--ink); font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; font-variant-numeric: tabular-nums; }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .axis { stroke: var(--axis); stroke-width: 1; }
  .line { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .whisker { stroke: var(--ink2); stroke-width: 1.5; }
</style>

<rect class="bg" width="760" height="420" rx="8"/>
<title id="t">Push-to-pop latency by percentile</title>
<desc id="d">Latency percentile curves for the mutex baseline and SPSC queue variants, median of runs, log scale.</desc>
<text class="title" x="70" y="28">Push-to-pop latency by percentile</text>
<text class="subtitle" x="70" y="46">1 event/µs, separate cores, median of runs. Baseline: indices share a cache line. Tuned: padded + cached indices.</text>
<line class="grid" x1="70" x2="736" y1="324.0" y2="324.0"/>
<text class="tick" x="62" y="328.0" text-anchor="end">10 ns</text>
<line class="grid" x1="70" x2="736" y1="272.0" y2="272.0"/>
<text class="tick" x="62" y="276.0" text-anchor="end">100 ns</text>
<line class="grid" x1="70" x2="736" y1="220.0" y2="220.0"/>
<text class="tick" x="62" y="224.0" text-anchor="end">1 µs</text>
<line class="grid" x1="70" x2="736" y1="168.0" y2="168.0"/>
<text class="tick" x="62" y="172.0" text-anchor="end">10 µs</text>
<line class="grid" x1="70" x2="736" y1="116.0" y2="116.0"/>
<text class="tick" x="62" y="120.0" text-anchor="end">100 µs</text>
<line class="grid" x1="70" x2="736" y1="64.0" y2="64.0"/>
<text class="tick" x="62" y="68.0" text-anchor="end">1 ms</text>
<line class="grid" x1="70.0" x2="70.0" y1="64" y2="324"/>
<text class="tick" x="70.0" y="342" text-anchor="middle">p50</text>
<line class="grid" x1="195.8" x2="195.8" y1="64" y2="324"/>
<text class="tick" x="195.8" y="342" text-anchor="middle">p90</text>
<line class="grid" x1="375.9" x2="375.9" y1="64" y2="324"/>
<text class="tick" x="375.9" y="342" text-anchor="middle">p99</text>
<line class="grid" x1="555.9" x2="555.9" y1="64" y2="324"/>
<text class="tick" x="555.9" y="342" text-anchor="middle">p99.9</text>
<line class="grid" x1="736.0" x2="736.0" y1="64" y2="324"/>
<text class="tick" x="736.0" y="342" text-anchor="middle">p99.99</text>
<line class="axis" x1="70" x2="736" y1="324" y2="324"/>
<path class="line" style="stroke:var(--s2)" d="M70.0,235.2 L87.4,234.6 L109.9,233.2 L124.2,230.7 L141.6,223.8 L195.8,205.4 L250.1,189.3 L290.0,173.8 L321.7,162.1 L375.9,147.6 L430.1,135.5 L470.0,127.3 L555.9,104.4 L610.2,92.1 L650.1,81.3 L736.0,76.2"/>
<circle cx="70.0" cy="235.2" r="4" style="fill:var(--s2)" stroke="var(--surface)" stroke-width="2"><title>std::mutex + std::queue p50: 510 ns</title></circle>
<circle cx="195.8" cy="205.4" r="4" style="fill:var(--s2)" stroke="var(--surface)" stroke-width="2"><title>std::mutex + std::queue p90: 1.908 µs</title></circle>
<circle cx="375.9" cy="147.6" r="4" style="fill:var(--s2)" stroke="var(--surface)" stroke-width="2"><title>std::mutex + std::queue p99: 24.687 µs</title></circle>
<circle cx="555.9" cy="104.4" r="4" style="fill:var(--s2)" stroke="var(--surface)" stroke-width="2"><title>std::mutex + std::queue p99.9: 166.987 µs</title></circle>
<circle cx="736.0" cy="76.2" r="4" style="fill:var(--s2)" stroke="var(--surface)" stroke-width="2"><title>std::mutex + std::queue p99.99: 581.72 µs</title></circle>
<path class="line" style="stroke:var(--s3)" d="M70.0,270.4 L87.4,269.4 L109.9,269.4 L124.2,268.5 L141.6,267.5 L195.8,251.9 L250.1,209.0 L290.0,201.4 L321.7,198.2 L375.9,183.9 L430.1,163.8 L470.0,152.3 L555.9,128.4 L610.2,111.6 L650.1,101.2 L736.0,78.6"/>
<circle cx="70.0" cy="270.4" r="4" style="fill:var(--s3)" stroke="var(--surface)" stroke-width="2"><title>SPSC baseline p50: 108 ns</title></circle>
<circle cx="195.8" cy="251.9" r="4" style="fill:var(--s3)" stroke="var(--surface)" stroke-width="2"><title>SPSC baseline p90: 244 ns</title></circle>
<circle cx="375.9" cy="183.9" r="4" style="fill:var(--s3)" stroke="var(--surface)" stroke-width="2"><title>SPSC baseline p99: 4.95 µs</title></circle>
