<path class="line" style="stroke:var(--s1)" d="M70.0,272.4 L87.4,271.3 L109.9,270.4 L124.2,269.4 L141.6,269.3 L195.8,255.6 L250.1,210.7 L290.0,202.0 L321.7,198.6 L375.9,183.1 L430.1,161.7 L470.0,148.1 L555.9,117.1 L610.2,99.3 L650.1,89.8 L736.0,77.6"/>
<circle cx="70.0" cy="272.4" r="4" style="fill:var(--s1)" stroke="var(--surface)" stroke-width="2"><title>SPSC tuned p50: 98 ns</title></circle>
<circle cx="195.8" cy="255.6" r="4" style="fill:var(--s1)" stroke="var(--surface)" stroke-width="2"><title>SPSC tuned p90: 207 ns</title></circle>
<circle cx="375.9" cy="183.1" r="4" style="fill:var(--s1)" stroke="var(--surface)" stroke-width="2"><title>SPSC tuned p99: 5.123 µs</title></circle>
<circle cx="555.9" cy="117.1" r="4" style="fill:var(--s1)" stroke="var(--surface)" stroke-width="2"><title>SPSC tuned p99.9: 95.352 µs</title></circle>
<circle cx="736.0" cy="77.6" r="4" style="fill:var(--s1)" stroke="var(--surface)" stroke-width="2"><title>SPSC tuned p99.99: 547.488 µs</title></circle>
<line x1="70" x2="88" y1="380" y2="380" style="stroke:var(--s2)" stroke-width="2" stroke-linecap="round"/>
<text class="label" x="94" y="384">std::mutex + std::queue</text>
<line x1="283.0" x2="301.0" y1="380" y2="380" style="stroke:var(--s3)" stroke-width="2" stroke-linecap="round"/>
<text class="label" x="307.0" y="384">SPSC baseline</text>
<line x1="426.0" x2="444.0" y1="380" y2="380" style="stroke:var(--s1)" stroke-width="2" stroke-linecap="round"/>
<text class="label" x="450.0" y="384">SPSC tuned</text>
<text class="tick" x="736" y="406" text-anchor="end">Above p99, samples are dominated by WSL2 vCPU scheduling noise.</text>
</svg>